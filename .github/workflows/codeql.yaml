name: codeql

# CodeQL runs from the shared thingzio/actions workflow, which builds the module
# explicitly rather than trusting autobuild. See
# https://github.com/thingzio/actions/blob/main/.github/workflows/codeql-go.md

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.read.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: echo "go=$(awk '$1=="go:"{print $2}' .versions.yaml)" >> "$GITHUB_OUTPUT"

  analyze:
    needs: versions
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: thingzio/actions/.github/workflows/codeql-go.yaml@7276775800dbfef1d9671e60c337f3b4b479a4e8 # v1.8.0
    with:
      go_version: ${{ needs.versions.outputs.go }}
